# =============================================================================
# kkongal nginx 사이트 설정 (동일 오리진 배포).
#
#   브라우저 ──HTTPS──> nginx ┬─ /            → 빌드된 SPA(정적 파일)
#                             ├─ /api, /admin → gunicorn(127.0.0.1:8000) 리버스 프록시
#                             └─ /static      → Django 정적 파일(collectstatic 산출물)
#
# SPA 와 API 가 같은 오리진이라 JWT 쿠키가 first-party 로 오가고 CORS 가 필요 없다
# (개발의 Vite `/api` 프록시와 동일한 구조).
#
# 설치:
#   sudo cp deploy/nginx-kkongal.conf /etc/nginx/sites-available/kkongal
#   sudo ln -s /etc/nginx/sites-available/kkongal /etc/nginx/sites-enabled/kkongal
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS 인증서는 certbot 으로 발급하는 것을 권장한다:
#   sudo certbot --nginx -d kkongal.cloud
# (certbot 이 아래 server 블록에 443/인증서 설정을 자동 추가한다.)
# =============================================================================

server {
    listen 80;
    server_name kkongal.cloud;

    # 빌드된 SPA 위치(frontend `npm run build` 산출물 dist/ 를 여기에 배포).
    root /var/www/kkongal;
    index index.html;

    # 업로드/응답 본문 크기 여유(관리자 업로드 등).
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── API · 관리자 → gunicorn ───────────────────────────────────────────────
    # X-Forwarded-Proto 로 실제 스킴을 전달한다. settings 의
    # SECURE_PROXY_SSL_HEADER=('HTTP_X_FORWARDED_PROTO','https') 와 맞물려
    # request.is_secure() 가 HTTPS 뒤에서도 올바르게 동작한다.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Django/DRF/admin 정적 파일(collectstatic 산출물) ──────────────────────
    # STATIC_ROOT = backend/staticfiles. 배포 경로에 맞게 alias 를 수정한다.
    location /static/ {
        alias /home/ubuntu/kkongal/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # ── SPA 라우팅 ────────────────────────────────────────────────────────────
    # 해시된 에셋은 장기 캐시, 그 외 경로는 클라이언트 라우팅을 위해 index.html 로.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
